name: uniad
display_name: UniAD
description: Unified Autonomous Driving (HUGSIM e2e adapter).

launcher:
  type: shell
  conda_env: uniad
  entrypoint: third_party/uniad_sim/tools/e2e.sh
  cwd: third_party/uniad_sim
  args: ["${cuda_id}", "${output_dir}"]
  env:
    PYTHONUNBUFFERED: "1"

ipc:
  protocol: hugsim_pickle_v1
  obs_pipe: obs_pipe
  plan_pipe: plan_pipe
  pickle_protocol: 4
  done_sentinel: "Done"

observation:
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]
  needs_depth: false
  needs_lidar: false
  ego_state: true
  hd_map: hugsim_compat
  history_frames: 0

output:
  type: trajectory
  horizon_seconds: 3.0
  dt: 0.5
  frame: ego_local
  fields: [x, y]

capabilities:
  closed_loop: true
  open_loop: true
  multi_camera: true
