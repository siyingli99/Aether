name: gaussianfusion
title: GaussianFusion
description: Gaussian multi-sensor fusion planner (camera + LiDAR, NAVSIM-trained).
command: [bash, "${AETHER_EXTERNAL}/GaussianFusion/tools/e2e.sh", "${cuda}", "${workdir}"]
cwd: "${AETHER_EXTERNAL}/GaussianFusion"
env:
  PYTHONUNBUFFERED: "1"
  GAUSSIANFUSION_STRICT: "1"
  NAVSIM_DEVKIT_ROOT: "${AETHER_EXTERNAL}/GaussianFusion"
  NAVSIM_EXP_ROOT: "${AETHER_EXTERNAL}/GaussianFusion/exp"
ready: ["[gf] ready", "ready for"]
protocol: tuple
input:
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK]
  lidar: true
output: {dt: 0.5, frame: rear_axle, axes: rfu}
